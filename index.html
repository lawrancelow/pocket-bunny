.device[data-shell="sakura"] .skin{filter:hue-rotate(52deg) saturate(1.05) drop-shadow(0 12px 18px rgba(0,0,0,.5))}
.device[data-shell="mint"] .skin{filter:hue-rotate(-128deg) saturate(.85) drop-shadow(0 12px 18px rgba(0,0,0,.5))}
.device[data-shell="sky"] .skin{filter:hue-rotate(-48deg) drop-shadow(0 12px 18px rgba(0,0,0,.5))}

.ov{position:absolute}
.brand{left:30%;width:40%;top:25.6%;height:4.4%;display:flex;align-items:center;justify-content:center;gap:calc(var(--d)*.008);color:#5b3f7a;font-weight:900;letter-spacing:.16em;font-size:calc(var(--d)*.032);text-shadow:0 1px 0 rgba(255,255,255,.45),0 -1px 0 rgba(60,30,90,.25);white-space:nowrap}
.brand canvas{width:calc(var(--d)*.03);height:calc(var(--d)*.03);image-rendering:pixelated}
.icons{display:grid;grid-template-columns:repeat(5,1fr);left:19%;width:62%}
#icT{top:36.4%;height:6.3%}
#icB{top:68.0%;height:6.3%}
.ic{appearance:none;border:0;background:transparent;border-radius:calc(var(--d)*.016);padding:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:calc(var(--d)*.002);color:var(--face-ink);font:700 calc(var(--d)*.022)/1.1 var(--f-ui);cursor:pointer;letter-spacing:.06em;opacity:.8;transition:opacity .15s,background .15s;margin:calc(var(--d)*.004)}
.ic canvas{width:calc(var(--d)*.046);height:calc(var(--d)*.046);image-rendering:pixelated}
.ic.sel{opacity:1;color:#fff;background:rgba(255,255,255,.14);box-shadow:inset 0 -2px 0 #fff}
.ic.need{opacity:1;color:var(--need);background:rgba(255,210,90,.14);animation:glow 1.1s ease-in-out infinite}
.ic.need.sel{color:#fff}
.ic.call.on{opacity:1;color:var(--alert);background:rgba(255,107,129,.16);animation:blink 1s steps(2) infinite}
.ic:focus-visible,.btn:focus-visible{outline:3px solid #fff;outline-offset:2px}
@keyframes blink{50%{background:rgba(255,107,129,.36)}}
@keyframes glow{0%,100%{box-shadow:0 0 0 0 rgba(255,210,90,0)}50%{box-shadow:0 0 calc(var(--d)*.016) calc(var(--d)*.002) rgba(255,210,90,.55);background:rgba(255,210,90,.26)}}
.lcd{left:21.1%;top:43.0%;width:57.7%;height:24.9%;background:var(--lcd);border-radius:calc(var(--d)*.006);overflow:hidden;box-shadow:inset 0 0 calc(var(--d)*.02) rgba(50,60,30,.45)}
.lcd canvas{position:absolute;top:0;height:100%;left:50%;transform:translateX(-50%);image-rendering:pixelated;touch-action:none}
.lcd::before{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(235,240,220,.16) 1px,transparent 1px),linear-gradient(90deg,rgba(235,240,220,.16) 1px,transparent 1px);background-size:calc(100% / 96 * .887) calc(100% / 64);pointer-events:none}
.glare{position:absolute;inset:0;pointer-events:none;background:linear-gradient(118deg,rgba(255,255,255,.2) 0%,rgba(255,255,255,.05) 30%,rgba(255,255,255,0) 31%);z-index:3}
#ui{position:absolute;inset:0;pointer-events:none;font-size:var(--fs);color:var(--ink);z-index:2}
#ui .panel{pointer-events:auto;position:absolute;inset:0;background-color:var(--lcd);background-image:linear-gradient(rgba(235,240,220,.18) 1px,transparent 1px),linear-gradient(90deg,rgba(235,240,220,.18) 1px,transparent 1px);background-size:calc(100% / 108) calc(100% / 64);border:3px solid var(--ink);border-radius:3px;display:flex;flex-direction:column;overflow:hidden;text-shadow:1px 1px 0 rgba(42,39,34,.13)}
#ui .ttl{background:var(--ink);color:var(--lcd);padding:.14em .55em;font-weight:800;letter-spacing:.06em;display:flex;justify-content:space-between;gap:.5em;flex:none;white-space:nowrap;text-shadow:none}
#ui .ttl span{font-weight:600;opacity:.8;letter-spacing:0}
#ui .body{overflow-y:auto;padding:.3em .5em;flex:1;line-height:1.45;overscroll-behavior:contain;scrollbar-width:thin;scrollbar-color:var(--ink) transparent;touch-action:pan-y}
#ui ul{list-style:none;margin:0;padding:0}
#ui li{padding:.16em .4em .16em 1.1em;border-radius:2px;cursor:pointer;display:flex;justify-content:space-between;gap:.6em;align-items:baseline;position:relative;border-bottom:1px dashed rgba(42,39,34,.18)}
#ui li:last-child{border-bottom:0}
#ui li small{font-size:.78em;opacity:.8;text-align:right}
#ui li.sel{background:var(--ink);color:var(--lcd);text-shadow:none}
#ui li.sel::before{content:"";position:absolute;left:.35em;top:50%;width:0;height:0;border-left:.38em solid var(--lcd);border-top:.28em solid transparent;border-bottom:.28em solid transparent;transform:translateY(-50%)}
#ui li.dis{opacity:.5}
#ui p{margin:.15em 0}
#ui .row{display:flex;justify-content:space-between;gap:.6em}
#ui .k{opacity:.72}
#ui .sm{font-size:.78em;line-height:1.4}
#ui .ttl2{font-weight:800;margin:.05em 0 .25em}
#ui .hearts{letter-spacing:.08em}
#ui .tg{display:grid;grid-template-columns:3.3em 1fr 3.3em;gap:.45em;align-items:center;font-size:.76em;line-height:1.38}
#ui .tg span:last-child{text-align:right}
#ui .bar{position:relative;height:.45em;border:2px solid var(--ink);border-radius:1px}

];

/* ================= utils ================= */
const rand=(a,b)=>a+Math.random()*(b-a);

const hexRgb=h=>[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];
const rgbHex=c=>'#'+c.map(v=>clamp(Math.round(v),0,255).toString(16).padStart(2,'0')).join('');
const mix=(a,b,t)=>{const x=hexRgb(a),y=hexRgb(b);return rgbHex(x.map((v,i)=>v+(y[i]-v)*t));};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function hsh(x,y,s){let h=(Math.imul(x,374761393)+Math.imul(y,668265263)+Math.imul(s,1442695041))|0;h=Math.imul(h^(h>>>13),1274126177);return((h^(h>>>16))>>>0)/4294967295;}
function vnoise(x,y,s){const cx=Math.floor(x/4),cy=Math.floor(y/4),fx=x/4-cx,fy=y/4-cy;const a=hsh(cx,cy,s),b=hsh(cx+1,cy,s),c=hsh(cx,cy+1,s),d=hsh(cx+1,cy+1,s);const sx=fx*fx*(3-2*fx),sy=fy*fy*(3-2*fy);return a+(b-a)*sx+(c-a)*sy+(a-b-c+d)*sx*sy;}

/* ================= genetics ================= */
function rndGenome(){const g={};for(const k in FREQ){const[x,y,p]=FREQ[k];g[k]=[Math.random()<p?x:y,Math.random()<p?x:y];}return g;}
function cross(m,d){const g={};for(const k in FREQ)g[k]=[m[k][Math.random()<.5?0:1],d[k][Math.random()<.5?0:1]];return g;}
function phen(g){
  const has=(l,a)=>g[l][0]===a||g[l][1]===a;
  const albino=!has('C','C');
  const ear=(g.L[0]==='L'?1:0)+(g.L[1]==='L'?1:0);
  let ck,broken=false;
  if(albino)ck='albino';else{ck=(has('A','A')?'A':'S')+(has('B','B')?'B':'b')+(has('D','D')?'D':'d');broken=has('E','E');}
  const colorName=(broken?'花斑':'')+COATS[ck].n;
  return{ck,broken,albino,ear,earName:EARN[ear],colorName,ckey:ck+(broken?'E':''),key:ck+(broken?'E':'')+'|'+ear,name:colorName+'·'+EARN[ear]};
}

/* ================= personality ================= */
const quirkOf=id=>QUIRKS.find(q=>q.id===id)||QUIRKS[0];
function adjOf(tr){const L=TR.map(k=>[k,tr[k]]).filter(([k,v])=>v>=68||v<=32).sort((a,b)=>Math.abs(b[1]-50)-Math.abs(a[1]-50)).slice(0,2).map(([k,v])=>TRN[k][v>=68?1:0]);return L.length?L.join('又'):'性格温和';}

function genPersona(mom,dad){
  const tr={};
  for(const k of TR)tr[k]=mom&&dad?clamp(Math.round((mom.tr[k]+dad.tr[k])/2+gauss()*45),0,100):ri(4,96);
  const x=Math.random();let quirk;
  if(mom&&x<.2)quirk=mom.quirk;else if(dad&&x<.4)quirk=dad.quirk;else quirk=QUIRKS[ri(0,QUIRKS.length-1)].id;
  const fav=mom&&dad&&Math.random()<.3?(Math.random()<.5?mom.fav:dad.fav):TREAT_IDS[ri(0,3)];
  let hate;do{hate=TREAT_IDS[ri(0,3)];}while(hate===fav);
  return{tr,quirk,fav,hate};
}
function uniquePersona(mom,dad,taken){let p;for(let i=0;i<60;i++){p=genPersona(mom,dad);if(!taken.has(titleP(p)))return p;}return p;}

function layout(){
  const vw=document.documentElement.clientWidth||window.innerWidth,vh=window.innerHeight;

  // phones: let the toy bleed past both sides so the screen gets ~85% of the width; desktop: whole toy, sized to height
  let d=Math.min(vw/0.68,(vh-12-hintH)*1024/1405);
  d=Math.max(300,Math.floor(d));
  document.documentElement.style.setProperty('--d',d+'px');
  const r=lcdEl.getBoundingClientRect();const lh=r.height,lw=Math.min(r.width,lh*1.5);

}
